<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الذكاء الاصطناعي الشامل</title>
    <meta name="description" content="دليل شامل ومحدث لأفضل أدوات الذكاء الاصطناعي في مجالات الدراسة، البرمجة، الإنتاجية، والصور — مقارنات ووصف تفصيلي لكل أداة.">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #ec4899;
            --bg-color: #050505;
            --card-bg: #141414;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #262626;
            --sidebar-width: 280px;
            --header-height: 80px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--bg-color); overflow-x: hidden; color: var(--text-main); }

        header {
            display: flex; align-items: center; justify-content: space-between;
            height: var(--header-height); padding: 0 30px;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px);
            position: fixed; width: 100%; top: 0; z-index: 1002;
            border-bottom: 1px solid var(--border-color);
        }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
