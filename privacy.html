<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الخصوصية - دليل الذكاء الاصطناعي الشامل</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #ec4899;
            --bg-color: #050505;
            --card-bg: #141414;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #262626;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 30px; border-bottom: 1px solid var(--border-color);
        }
        .header-title {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 14px;
            border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px;
        }
        .back-link:hover { color: var(--text-main); border-color: var(--primary-color); }
        main {
            max-width: 800px; margin: 0 auto; padding: 50px 30px 100px 30px;
            line-height: 1.9; color: var(--text-muted);
        }
        h1 { color: var(--text-main); font-size: 28px; margin-bottom: 10px; }
        .updated { font-size: 13px; color: var(--text-muted); margin-bottom: 40px; }
        h2 { color: var(--text-main); font-size: 20px; margin-top: 40px; }
        p, li { font-size: 15px; }
        ul { padding-inline-start: 22px; }
